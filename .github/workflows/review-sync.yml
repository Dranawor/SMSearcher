```yaml
name: Sync shared review status

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build shared review file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess

          repo = os.environ["GITHUB_REPOSITORY"]

          issues = json.loads(subprocess.check_output(
              [
                  "gh", "issue", "list",
                  "--repo", repo,
                  "--state", "all",
                  "--limit", "1000",
                  "--json", "number,title,author,createdAt,url,body"
              ],
              text=True
          ))

          issues.sort(key=lambda issue: issue.get("createdAt", ""))

          reviews_path = "data/reviews.json"

          try:
              with open(reviews_path, encoding="utf-8") as f:
                  reviews = json.load(f)
          except FileNotFoundError:
              reviews = {}

          for issue in issues:
              title = issue.get("title", "")

              single = re.match(
                  r"^\[(REVIEW|UNREVIEW)\]\s+(\d+)\b",
                  title,
                  re.I
              )

              bulk = re.match(
                  r"^\[(REVIEW|UNREVIEW)\s+BULK\]\s+\d+\s+Workshop listings",
                  title,
                  re.I
              )

              if not single and not bulk:
                  continue

              author = (issue.get("author") or {}).get("login")

              if not author:
                  continue

              try:
                  permission = subprocess.check_output(
                      [
                          "gh", "api",
                          f"repos/{repo}/collaborators/{author}/permission",
                          "--jq", ".permission"
                      ],
                      text=True,
                      stderr=subprocess.DEVNULL
                  ).strip()
              except subprocess.CalledProcessError:
                  continue

              if permission not in {"admin", "maintain", "push", "triage"}:
                  continue

              action = (single or bulk).group(1).upper()

              if single:
                  ids = [single.group(2)]
              else:
                  body = issue.get("body") or ""
                  ids = re.findall(r"(?m)^-\s+(\d+)\s*$", body)

              note = ""
              match = re.search(
                  r"(?ms)^Review note:\s*\n(.*?)(?:\n---|\Z)",
                  issue.get("body") or ""
              )

              if match:
                  note = match.group(1).strip()

              for listing_id in ids:
                  if action == "REVIEW":
                      reviews[listing_id] = {
                          "reviewed": True,
                          "reviewer": author,
                          "reviewed_at": issue.get("createdAt"),
                          "note": note,
                          "issue_url": issue.get("url")
                      }
                  else:
                      reviews.pop(listing_id, None)

          os.makedirs("data", exist_ok=True)

          with open(reviews_path, "w", encoding="utf-8") as f:
              json.dump(reviews, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY

      - name: Commit shared review status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reviews.json
          git diff --cached --quiet || git commit -m "Update shared review status"
          git push
```
