name: Sync shared review status

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub review issue number to replay
        required: true
        type: string

permissions:
  contents: write
  issues: read

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.issue.title, '[REVIEW]') ||
      startsWith(github.event.issue.title, '[UNREVIEW]') ||
      startsWith(github.event.issue.title, '[REVIEW BULK]') ||
      startsWith(github.event.issue.title, '[UNREVIEW BULK]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Apply review issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          repo = os.environ["REPO"]
          number = os.environ["ISSUE_NUMBER"].strip()
          if not number.isdigit():
              raise SystemExit("A valid issue number is required")

          issue = json.loads(subprocess.check_output(
              ["gh", "api", f"repos/{repo}/issues/{number}"], text=True
          ))
          if "pull_request" in issue:
              raise SystemExit("Pull requests cannot modify review status")
          title = issue.get("title") or ""
          single = re.match(r"^\[(REVIEW|UNREVIEW)\]\s+(\d+)\b", title, re.I)
          bulk = re.match(r"^\[(REVIEW|UNREVIEW)\s+BULK\]\s+\d+\s+Workshop listings\b", title, re.I)
          if not single and not bulk:
              print("Not a review issue; no changes needed")
              raise SystemExit(0)

          author = (issue.get("user") or {}).get("login")
          if not author:
              raise SystemExit("Review issue has no identifiable author")
          permission = subprocess.check_output(
              ["gh", "api", f"repos/{repo}/collaborators/{author}/permission", "--jq", ".permission"],
              text=True
          ).strip()
          if permission not in {"admin", "maintain", "write", "push", "triage"}:
              raise SystemExit(f"{author} lacks permission to modify shared reviews")

          body = issue.get("body") or ""
          ids = [single.group(2)] if single else re.findall(r"(?m)^-\s+(\d+)\b", body)
          if not ids:
              raise SystemExit("No Workshop IDs in review issue")
          match = re.search(r"(?ms)^Review note:[ \t]*\n(.*?)(?:\n---|\Z)", body)
          note = match.group(1).strip() if match else ""
          reviews_path = Path("data/reviews.json")
          reviews = json.loads(reviews_path.read_text(encoding="utf-8"))
          action = (single or bulk).group(1).upper()
          for listing_id in set(ids):
              if action == "REVIEW":
                  reviews[listing_id] = {
                      "reviewed": True,
                      "reviewer": author,
                      "reviewed_at": issue.get("created_at"),
                      "note": note,
                      "issue_url": issue.get("html_url", "")
                  }
              else:
                  reviews.pop(listing_id, None)

          reviews_path.write_text(json.dumps(reviews, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(f"Applied {action} for {len(set(ids))} listings from issue #{number}")
          PY

      - name: Commit shared review status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reviews.json
          git diff --cached --quiet || git commit -m "Sync Workshop review issue"
          git pull --rebase origin main
          git push origin HEAD:main
