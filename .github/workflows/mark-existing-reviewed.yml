name: Mark Existing Listings Reviewed

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mark-reviewed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Mark existing listings reviewed
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          results_path = "data/results.json"
          reviews_path = "data/reviews.json"

          with open(results_path, encoding="utf-8") as f:
              results = json.load(f)

          try:
              with open(reviews_path, encoding="utf-8") as f:
                  reviews = json.load(f)
          except FileNotFoundError:
              reviews = {}

          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")

          items = results.get("items", [])
          added = 0
          already_reviewed = 0

          for item in items:
              item_id = str(item.get("id", "")).strip()

              if not item_id:
                  continue

              if item_id in reviews and reviews[item_id].get("reviewed"):
                  already_reviewed += 1
                  continue

              reviews[item_id] = {
                  "reviewed": True,
                  "reviewer": "Dranawor",
                  "reviewed_at": now,
                  "note": "Existing listing marked reviewed during initial database migration."
              }

              added += 1

          with open(reviews_path, "w", encoding="utf-8") as f:
              json.dump(reviews, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print(f"Current listings: {len(items)}")
          print(f"Already reviewed: {already_reviewed}")
          print(f"Newly marked reviewed: {added}")
          print(f"Total review records: {len(reviews)}")
          PY

      - name: Commit review status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reviews.json
          git diff --cached --quiet || git commit -m "Mark existing Workshop listings as reviewed"
          git push
