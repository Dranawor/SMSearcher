name: Scan Steam Workshop

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install requests
      - name: Scan Workshop
        run: python scanner/scan.py
      - name: Commit scan results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json
          git diff --cached --quiet || git commit -m "Update Workshop scan results"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Alert on newly verified listings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import subprocess

          with open("data/results.json", encoding="utf-8") as f:
              data = json.load(f)
          new = [item for item in data.get("items", []) if item.get("is_new")]
          if not new:
              print("No newly published Workshop listings")
          else:
              body = f"## Newly published Workshop matches\n\nFound {len(new)} listing(s).\n\n"
              body += "\n".join(
                  f"- [{item.get('title', 'Untitled')}]({item['url']}) — "
                  + ", ".join(item.get("keywords", []))
                  for item in new
              )
              subprocess.run(
                  ["gh", "issue", "create", "--title", "New Workshop matches — " + data["scan"]["completed_at"][:10], "--body", body],
                  check=True
              )
          PY
